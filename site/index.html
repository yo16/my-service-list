<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>My Services</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%231f9d55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>My Services</h1>
      <p class="meta" id="meta" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <p id="loading" class="empty" role="status">読み込んでいます…</p>

    <section id="unlock" class="unlock" hidden>
      <form id="unlock-form" novalidate>
        <label for="passphrase">パスフレーズ</label>
        <input id="passphrase" type="password" autocomplete="current-password" required autofocus>
        <label class="check">
          <input type="checkbox" id="remember"> このブラウザで記憶する
        </label>
        <button type="submit" class="primary">開く</button>
        <p id="unlock-error" class="error" role="alert"></p>
      </form>
    </section>

    <div id="banner" class="banner" hidden></div>
    <p id="fatal" class="error" role="alert" hidden></p>

    <section id="app" tabindex="-1" hidden>
      <div class="filters">
        <div class="search-row">
          <input id="search" type="search" placeholder="名前、説明、インフラ、タグなどで検索" aria-label="検索">
          <span id="result-count" class="result-count" role="status"></span>
          <button type="button" id="clear-filters" class="link-button" hidden>条件をクリア</button>
        </div>
        <div class="toggle-group" id="stage-filter" role="group" aria-label="段階"></div>
        <details class="tag-details" id="infra-details" hidden>
          <summary>インフラ<span id="infra-summary" class="tag-summary"></span></summary>
          <div class="chip-group" id="infra-filter" role="group" aria-label="インフラ"></div>
        </details>
        <details class="tag-details" id="tag-details" hidden>
          <summary>タグ<span id="tag-summary" class="tag-summary"></span></summary>
          <div class="chip-group" id="tag-filter" role="group" aria-label="技術タグ"></div>
        </details>
      </div>

      <div class="table-wrap">
        <table class="services">
          <thead>
            <tr>
              <th class="col-id"><button type="button" class="sort" data-sort="id">No.</button></th>
              <th class="col-up"><span class="visually-hidden">死活</span></th>
              <th class="col-name">サービス</th>
              <th class="col-stage">段階</th>
              <th class="col-infra">インフラ</th>
              <th class="col-tags">技術</th>
              <th class="col-date col-released"><button type="button" class="sort" data-sort="releasedOn">公開日</button></th>
              <th class="col-date"><button type="button" class="sort" data-sort="pushedAt">最終更新</button></th>
              <th class="col-links"><span class="visually-hidden">リンク</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>条件に合うサービスはありません。</p>

      <footer class="legend">
        <span><i class="dot dot-up"></i>稼働中</span>
        <span><i class="dot dot-down"></i>停止</span>
        <span><i class="dot dot-idle"></i>一時停止・確認中</span>
        <span><i class="dot dot-none"></i>未監視</span>
        <span id="legend-site"></span>
        <span id="legend-repo"></span>
        <button type="button" id="lock" class="link-button" hidden>このブラウザの記憶を消す</button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
